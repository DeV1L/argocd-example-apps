# MongoDB tier. Data is stored on the node's SECOND disk via a static PV pinned to a
# FIXED host path (/mnt/data/mongodb). Durantic reimages only the system disk on a
# re-provision, and this path is reused every rebuild (a dynamic local-path PVC would
# get a new directory each time), so the data survives. Reachable in-cluster at
# mongodb:27017 (never exposed externally).
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
type: Opaque
stringData:
  # DEMO-ONLY credentials. This is a throwaway demo cluster and MongoDB is only
  # reachable inside the cluster. Do NOT reuse these anywhere real.
  MONGO_INITDB_ROOT_USERNAME: "root"
  MONGO_INITDB_ROOT_PASSWORD: "durantic-demo-mongo-pw"
  MONGODB_URL: "mongodb://root:durantic-demo-mongo-pw@mongodb:27017/?authSource=admin"
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    app: mongodb
spec:
  selector:
    app: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
---
# Static PV pinned to the data-disk path. Retain + claimRef so the same PVC always
# rebinds to the same directory across cluster rebuilds.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongodb-data
spec:
  capacity:
    storage: 2Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/data/mongodb
    type: DirectoryOrCreate
  claimRef:
    namespace: nodejs-app-mongodb
    name: mongodb-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: manual
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:8.0
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: MONGO_INITDB_ROOT_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongodb-data
