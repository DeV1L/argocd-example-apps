# Exposes the ArgoCD web UI on the node's public IP at :30080.
# ArgoCD runs with server.insecure=true (plain HTTP on container port 8080), so this
# NodePort serves the UI over HTTP at http://<node-public-ip>:30080.
apiVersion: v1
kind: Service
metadata:
  name: argocd-server-nodeport
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
